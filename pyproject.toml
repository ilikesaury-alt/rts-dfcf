[build-system]
requires = ["setuptools>=64.0"]
# 2026-08-29 修复：此前为 "setuptools.backends._legacy:_Backend"——该模块不存在
# （importlib 验证失败），任何 pip install / 构建入口都会直接报错。
build-backend = "setuptools.build_meta"

# 2026-09-13 补 [project]：此前 pyproject 只有 build-system + 工具配置，没有包元数据
# ——`pip install .` 能跑但装出来的 dist 名是 UNKNOWN/0.0.0，且 setuptools 走
# **自动发现**，在「顶层有多个包 + 多个散装 .py 脚本」的扁平布局下直接报
# "Multiple top-level packages discovered"。故显式声明 packages（含子包）。
# 本项目当前以源码直跑为主（`python unified_scanner.py`），不依赖安装；
# 加元数据是为后续 console_scripts / 可复现构建留口子。
[project]
name = "rts-dfcf-max"
version = "0.1.0"
description = "A股创业板飙升榜扫描器：多策略候选池 → 统一评分 → next_day 口径推荐"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# 只打包 scanner 及其子包；顶层脚本（unified_scanner.py 等）与 tests/scripts 不进 wheel。
# 2026-09-20 补上 scanner.view：此前漏声明，`pip install .` 装出来的包不含该子包，
# 而 view/assemble.py 与 view/render.py 是展示层核心（ScannerView 消费方）⇒
# 安装后必然 ImportError。源码直跑时被 sys.path 兜住，所以一直没暴露。
packages = ["scanner", "scanner.db", "scanner.pipeline", "scanner.view"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 2026-08-29 扩充：原 select 仅 E/F/W/I，漏检大量复杂度与坏味道。分档纳入，
# 先守正确性（B=bugbear 常见 bug、S=bandit 安全），再守可读性（C4/SIM/RET/ARG/PTH）。
# ⚠ 存量数字随代码增长会漂移，引用前请以 `ruff check . --select <规则> --statistics` 实测为准。
# ⚠ 务必在**干净工作树**上测：临时诊断脚本落在仓库里会污染计数（本次实测曾被 2 个遗留脚本
#   抬高 55 条 / 使总量虚增到 267）。
# 2026-09-20 实测总量 = 264（原注释记 163，全线低估：C901 84 / PLR0912 53 /
# PLR0913 49 / PLR0915 37 / E501 22 / SIM105 19）。
select = [
    "E", "F", "W",  # pycodestyle / pyflakes（含 F821 未定义名）/ warning
    "I",            # isort
    "B",            # flake8-bugbear：可变默认参数、zip 无 strict、误用 assertRaises
    "S",            # flake8-bandit：静默吞异常（S110/S112）、SQL 拼接（S608）
    "C4",           # flake8-comprehensions
    "RET",          # flake8-return
    "SIM",          # flake8-simplify
]
ignore = [
    "S101",  # assert：本项目在测试与数据断言中大量使用，属既有风格
    # ── 已知技术债（`ruff check . --select <规则> --statistics` 实测存量，
    #    逐个排期后移出本表）。下列数字为 2026-09-20 快照，会随代码增长漂移 ──
    "C901",     # 圈复杂度过高 84 处：stock_report.main(461L) / display_priority(352L) 等
    "PLR0913",  # 参数过多 49 处：apply_all_bonuses(13参) / validate(6参)，待引入上下文对象
    "PLR0912",  # 分支过多 53 处
    "PLR0915",  # 语句过多 37 处
    "SIM105",   # 用 contextlib.suppress 替代 try/except/pass 19 处（与 S110 重叠，择一处理）
    "E501",     # 行过长 22 处
]
# 说明：ARG（未使用参数 460 处，多为测试 lambda 与回调签名）与 PTH（os.path → pathlib
# 60 处，纯churn 无收益）经评估不纳入，避免噪音淹没真实信号。

[tool.ruff.lint.per-file-ignores]
"unified_scanner.py" = ["E402"]  # load_dotenv/win32 reconfigure 必须先于 config 导入（有意为之）
"tests/*" = ["S105", "S106", "S311", "S608"]
"scripts/*" = ["S603", "S607", "S608"]
# view 包是刻意把 scanner.view.model 作为「格式化/视图模型」单一来源的层；
# assemble/render 通过 `from scanner.view.model import *` 复用其全部叶子辅助与常量，
# 该 star 导入名由 model 的 __all__ 显式约束，故在此忽略 F405（star 导入名「可能未定义」误报）。
"scanner/view/*" = ["F405"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "smoke: 真实 scanner.db / 外网依赖的集成测试（默认跳过，--run-smoke 运行）",
]
